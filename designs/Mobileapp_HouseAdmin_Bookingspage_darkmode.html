<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>StayHaven Dark Mode Bookings Mobile App (390x844)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Hide scrollbars cleanly while preserving scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0A0E1A] min-h-screen antialiased selection:bg-[#8B5CF6] selection:text-white">
<!-- Mobile App Frame 390x844 -->
<div class="w-full min-h-screen bg-[#0A0E1A] relative font-sans text-white flex flex-col">
<!-- 2. Sticky Mobile Header -->
<header class="sticky top-0 z-50 bg-[#0A0E1A]/90 backdrop-blur-md pt-6 px-4 pb-2 flex items-center justify-between border-b border-[#1E2A45]/30 flex-none">
<!-- Left: Logo & Brand -->
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-lg bg-[#8B5CF6] flex items-center justify-center shadow-md shadow-[#8B5CF6]/20">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
</div>
<span class="text-[18px] font-bold text-white tracking-tight">StayHaven</span>
</div>
<!-- Right Controls: Sun Toggle, Sign out, Profile -->
<div class="flex items-center gap-2">
<!-- Sun Mode Icon -->
<button aria-label="Toggle light theme" class="w-8 h-8 rounded-full bg-[#141B2D] border border-[#1E2A45] flex items-center justify-center text-white hover:bg-[#1E2A45] transition-colors" type="button">
<svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</button>
<!-- Sign out pill -->
<button class="bg-[#141B2D] text-slate-300 border border-[#1E2A45] text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-[#1E2A45] hover:text-white transition-colors" type="button">
          Sign out
        </button>
<!-- Profile Icon -->
<div class="w-8 h-8 rounded-full bg-[#8B5CF6] flex items-center justify-center text-white font-semibold text-xs shadow-sm ring-2 ring-[#8B5CF6]/30">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
</div>
</header>
<!-- Scrollable Body Content -->
<main class="flex-1 overflow-y-auto pb-28 no-scrollbar">
<!-- 3. Page Header -->
<section class="px-4 mt-6">
<p class="text-[12px] uppercase tracking-wider font-bold text-[#8B5CF6]">HOUSE ADMIN WORKSPACE</p>
<h1 class="text-[28px] font-bold text-white mt-1 leading-tight tracking-tight">Booking management</h1>
<p class="text-[14px] text-[#94A3B8] mt-1">Manage upcoming stays and guest requests.</p>
</section>
<!-- 4. Bookings List -->
<section class="mx-4 mt-6 flex flex-col gap-4 mb-8">
<!-- Card 1: Sophie Chen -->
<article class="bg-[#141B2D] p-4 border border-[#1E2A45] flex flex-col gap-3 shadow-sm hover:border-[#8B5CF6]/40 transition-colors rounded-[32px]">
<!-- Row 1 -->
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#2A1F4E] text-[#C4B5FD] font-semibold flex items-center justify-center text-sm ring-1 ring-[#8B5CF6]/30">
                SC
              </div>
<div class="flex flex-col">
<span class="text-[16px] font-bold text-white leading-snug">Sophie Chen</span>
<span class="text-[14px] text-[#94A3B8] font-normal">Cedar Haven Cottage</span>
</div>
</div>
<span class="px-3 py-1 rounded-full text-xs font-semibold bg-[#064E3B] text-[#4ADE80]">
              Confirmed
            </span>
</div>
<!-- Row 2 -->
<div class="pt-2 flex justify-between items-center border-t border-[#1E2A45]/40 mt-1">
<span class="text-[14px] text-[#94A3B8] font-medium flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-[#94A3B8]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
              Oct 18–22
            </span>
<button class="bg-[#2A1F4E] hover:bg-[#3B2C6E] text-[#A78BFA] hover:text-white font-semibold px-4 py-1.5 rounded-full text-sm transition-colors" type="button">
              Manage
            </button>
</div>
</article>
<!-- Card 2: Marcus Kelly -->
<article class="bg-[#141B2D] p-4 border border-[#1E2A45] flex flex-col gap-3 shadow-sm hover:border-[#8B5CF6]/40 transition-colors rounded-[32px]">
<!-- Row 1 -->
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#3F2E0A] text-[#FDE68A] font-semibold flex items-center justify-center text-sm ring-1 ring-amber-500/30">
                MK
              </div>
<div class="flex flex-col">
<span class="text-[16px] font-bold text-white leading-snug">Marcus Kelly</span>
<span class="text-[14px] text-[#94A3B8] font-normal">Hilltop Modern Villa</span>
</div>
</div>
<span class="px-3 py-1 rounded-full text-xs font-semibold bg-[#1E2A45] text-[#8B5CF6]">
              Checked in
            </span>
</div>
<!-- Row 2 -->
<div class="pt-2 flex justify-between items-center border-t border-[#1E2A45]/40 mt-1">
<span class="text-[14px] text-[#94A3B8] font-medium flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-[#94A3B8]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
              Oct 24–28
            </span>
<button class="bg-[#2A1F4E] hover:bg-[#3B2C6E] text-[#A78BFA] hover:text-white font-semibold px-4 py-1.5 rounded-full text-sm transition-colors" type="button">
              Manage
            </button>
</div>
</article>
<!-- Card 3: Elena & Julian -->
<article class="bg-[#141B2D] p-4 border border-[#1E2A45] flex flex-col gap-3 shadow-sm hover:border-[#8B5CF6]/40 transition-colors rounded-[32px]">
<!-- Row 1 -->
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#1E3A5F] text-[#93C5FD] font-semibold flex items-center justify-center text-sm ring-1 ring-blue-500/30">
                EJ
              </div>
<div class="flex flex-col">
<span class="text-[16px] font-bold text-white leading-snug">Elena &amp; Julian</span>
<span class="text-[14px] text-[#94A3B8] font-normal">Lakeside Pine Retreat</span>
</div>
</div>
<span class="px-3 py-1 rounded-full text-xs font-semibold bg-[#064E3B] text-[#4ADE80]">
              Confirmed
            </span>
</div>
<!-- Row 2 -->
<div class="pt-2 flex justify-between items-center border-t border-[#1E2A45]/40 mt-1">
<span class="text-[14px] text-[#94A3B8] font-medium flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-[#94A3B8]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
              Nov 2–7
            </span>
<button class="bg-[#2A1F4E] hover:bg-[#3B2C6E] text-[#A78BFA] hover:text-white font-semibold px-4 py-1.5 rounded-full text-sm transition-colors" type="button">
              Manage
            </button>
</div>
</article>
</section>
</main>
<!-- 6. Floating Bottom Nav -->
<nav class="fixed bottom-4 left-4 right-4 h-16 rounded-[32px] bg-[#141B2D] border border-[#1E2A45] shadow-2xl flex items-center justify-around z-50 max-w-[358px] mx-auto px-2">
<!-- Dashboard (INACTIVE) -->
<button class="text-[#94A3B8] hover:text-white flex flex-col items-center justify-center gap-1 px-3 py-1.5 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
<span class="text-xs font-medium">Dashboard</span>
</button>
<!-- Listings (INACTIVE) -->
<button class="text-[#94A3B8] hover:text-white flex flex-col items-center justify-center gap-1 px-3 py-1.5 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="16" x2="8" y1="13" y2="13"></line>
<line x1="16" x2="8" y1="17" y2="17"></line>
<polyline points="10 9 9 9 8 9"></polyline>
</svg>
<span class="text-xs font-medium">Listings</span>
</button>
<!-- Bookings (ACTIVE) -->
<button class="text-[#8B5CF6] flex items-center gap-2 bg-[#1E2A45] px-3.5 py-1.5 rounded-full shadow-inner" type="button">
<svg class="w-4 h-4 text-[#8B5CF6]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
<span class="text-xs font-semibold">Bookings</span>
</button>
</nav>
</div>




</body></html>
