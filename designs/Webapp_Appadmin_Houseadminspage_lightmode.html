</tr>

<tr class="hover:bg-slate-50/60 transition-colors">
<td class="py-5 pl-8 pr-4 whitespace-nowrap">
<div class="flex items-center gap-3.5">
<div class="w-11 h-11 rounded-[12px] bg-[#DBEAFE] flex items-center justify-center text-[#1E40AF] font-bold text-sm select-none">
