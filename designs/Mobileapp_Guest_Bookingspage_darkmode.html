<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayHaven - Bookings (Dark Mode) Mobile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbar for clean app experience */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0A0E1A] text-white m-0 p-0 overflow-hidden font-sans">
<!-- Mobile Viewport Container: 390x844 iPhone Frame -->
<div class="w-full h-[844px] bg-[#0A0E1A] relative flex flex-col font-sans overflow-hidden text-white">
<!-- STICKY MOBILE HEADER -->
<header class="sticky top-0 z-50 bg-[#0A0E1A]/90 backdrop-blur-md pt-6 px-4 pb-2 flex items-center justify-between border-b border-[#1E2A45]/30">
<!-- Left: Logo & Wordmark -->
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-lg bg-[#8B5CF6] flex items-center justify-center shadow-md shadow-purple-900/30">
<svg class="w-4 h-4 text-white stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[18px] font-bold text-white tracking-tight">StayHaven</span>
</div>
<!-- Right: Action Icons -->
<div class="flex items-center gap-2">
<!-- Sun icon in dark navy circle -->
<button class="w-8 h-8 rounded-full bg-[#141B2D] border border-[#1E2A45] flex items-center justify-center text-white hover:bg-[#1E2A45] transition-colors">
<svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- "Sign in" pill -->
<button class="px-3 py-1 text-xs font-semibold rounded-full bg-[#141B2D] text-slate-300 border border-[#1E2A45] hover:text-white transition-colors">
          Sign in
        </button>
<!-- Profile icon -->
<button class="w-8 h-8 rounded-full bg-[#8B5CF6] flex items-center justify-center text-white shadow-sm">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- MAIN SCROLLABLE AREA -->
<main class="flex-1 overflow-y-auto pb-24 no-scrollbar">
<!-- PAGE HEADER -->
<section class="px-4 mt-6">
<p class="text-[12px] uppercase tracking-wider font-bold text-[#8B5CF6]">YOUR TRIPS</p>
<h1 class="text-[28px] font-bold text-white mt-1 leading-tight">Bookings</h1>
<p class="text-[14px] text-[#94A3B8] mt-1">Everything you need for your upcoming and previous stays.</p>
<!-- Tab Toggle -->
<div class="mt-5 p-1 rounded-full bg-[#141B2D] border border-[#1E2A45] flex items-center">
<button class="flex-1 py-2 text-center text-xs font-semibold rounded-full bg-[#1E2A45] text-[#8B5CF6] shadow-sm transition-all">
            Current
          </button>
<button class="flex-1 py-2 text-center text-xs font-medium rounded-full text-[#94A3B8] hover:text-white transition-all">
            Past
          </button>
</div>
</section>
<!-- BOOKING CARDS -->
<section class="mx-4 mt-6 flex flex-col gap-4 mb-8">
<!-- Card 1: Lavender House -->
<div class="bg-[#141B2D] rounded-[32px] p-0 border border-[#1E2A45] overflow-hidden flex flex-col shadow-sm">
<div class="w-full h-[160px] relative overflow-hidden bg-slate-800">
<img alt="Lavender House Bedroom" class="w-full h-[160px] object-cover block" src="https://lh3.googleusercontent.com/aida/AEtjO1XODr53P0b7avMG1Aemrx7hsAACQKaORY0Vu61vbaX9BmgJqPU3KxVcHJQ_3wl27zFlU9Ml_5kwwjdXt2v3bBtl17RCva71w21_vnx-SWBLuxPvWzP1wdojPUk0Y8J3LTyG5dFJzyuYlL7fKkjubiNRObuyrWi6ogLCj9YVBQmlnSPKfTNXAj2K27mCzp-Je0NTip-RCLdGmMnELXQ9ieniZUAUDlD9VgsDGr-CG-K3BTsATyKsHj3gJhM"/>
</div>
<div class="p-5 flex flex-col gap-3">
<!-- Row 1: Title & Status -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<h3 class="text-[18px] font-bold text-white">Lavender House</h3>
<p class="text-[14px] text-[#94A3B8]">Kampala, Uganda</p>
</div>
<span class="bg-[#064E3B] text-[#4ADE80] border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
                Confirmed
              </span>
</div>
<!-- Divider -->
<hr class="border-t border-[#1E2A45] my-1"/>
<!-- Row 2: Dates & Action -->
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<svg class="w-4 h-4 text-[#A78BFA]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[14px] text-white font-medium">Jun 18–21</span>
</div>
<button class="text-[#A78BFA] font-semibold text-sm bg-transparent hover:text-purple-300 transition-colors">
                Details
              </button>
</div>
</div>
</div>
<!-- Card 2: The Cloud Villa -->
<div class="bg-[#141B2D] rounded-[32px] p-0 border border-[#1E2A45] overflow-hidden flex flex-col shadow-sm">
<div class="w-full h-[160px] relative overflow-hidden bg-slate-800">
<img alt="The Cloud Villa" class="w-full h-[160px] object-cover block" src="https://lh3.googleusercontent.com/aida/AEtjO1VrN4A_6BXS3Ra10RhIBtdNvhD8SMM3k-YebaXxoJ5zqG3kuhysI_fYRNCP8TS6ilJMao-EAdb8l8XiC3DGxd4emRImpSjeS0pHNyELfOI1ORcx44h0DdnuRqdZvyoLGc5mejQmivUgfxnIF1IQywicUmUm28akCiCaGLpL0H8bmJX5m1PqjlMDgWNa0HoAucRik_Cb-fIuvrWzXiQdqsX28ncg21r5Xsm_Z0ccRL1JbDNmRARc4Bf0-kw"/>
</div>
<div class="p-5 flex flex-col gap-3">
<!-- Row 1: Title & Status -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<h3 class="text-[18px] font-bold text-white">The Cloud Villa</h3>
<p class="text-[14px] text-[#94A3B8]">Jinja, Uganda</p>
</div>
<span class="bg-[#064E3B] text-[#4ADE80] border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
                Confirmed
              </span>
</div>
<!-- Divider -->
<hr class="border-t border-[#1E2A45] my-1"/>
<!-- Row 2: Dates & Action -->
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<svg class="w-4 h-4 text-[#A78BFA]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[14px] text-white font-medium">Aug 04–09</span>
</div>
<button class="text-[#A78BFA] font-semibold text-sm bg-transparent hover:text-purple-300 transition-colors">
                Details
              </button>
</div>
</div>
</div>
</section>
</main>
<!-- FLOATING BOTTOM NAV (Active Bookings) -->
<nav class="fixed bottom-4 left-4 right-4 h-16 rounded-[32px] bg-[#141B2D] border border-[#1E2A45] shadow-2xl flex items-center justify-around z-50 max-w-[358px] mx-auto px-2">
<!-- Explore (INACTIVE) -->
<button class="text-[#94A3B8] flex flex-col items-center justify-center gap-1 px-3 py-1.5 hover:text-white transition-colors">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none">Explore</span>
</button>
<!-- Bookings (ACTIVE) -->
<button class="text-[#8B5CF6] flex items-center gap-2 bg-[#1E2A45] px-3.5 py-1.5 rounded-full shadow-inner">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-xs font-semibold leading-none">Bookings</span>
</button>
<!-- Reviews (INACTIVE) -->
<button class="text-[#94A3B8] flex flex-col items-center justify-center gap-1 px-3 py-1.5 hover:text-white transition-colors">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none">Reviews</span>
</button>
</nav>
</div>
</body>
</html>
