<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>StayHaven Dark Mode Listings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

<body class="bg-[#05070D] flex justify-center items-start min-h-screen antialiased selection:bg-[#8B5CF6]/30">
<!-- Mobile Body Wrapper (390px strictly constrained) -->
<div class="w-[390px] h-[844px] mx-auto bg-[#0A0E1A] overflow-y-auto relative font-sans text-white shadow-2xl flex flex-col">

<header class="sticky top-0 z-50 bg-[#0A0E1A]/90 backdrop-blur-md pt-6 px-4 pb-2 flex items-center justify-between border-b border-[#1E2A45]/30">

<svg class="w-5 h-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"></path>
</svg>
</div>
<span class="text-[18px] font-bold text-white tracking-tight">StayHaven</span>
</div>
<!-- Right: Actions -->
<div class="flex items-center gap-2">
<!-- Sun Toggle -->
<button aria-label="Toggle theme" class="w-8 h-8 rounded-full bg-[#141B2D] border border-[#1E2A45] flex items-center justify-center text-white hover:bg-[#1E2A45] transition-colors">
<svg class="w-4 h-4 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">

</button>

<button class="bg-[#141B2D] text-slate-300 border border-[#1E2A45] text-xs font-medium px-3 py-1.5 rounded-full hover:text-white transition-colors">
          Sign out
        </button>
<!-- Profile Avatar -->
<div class="w-8 h-8 rounded-full bg-[#8B5CF6] flex items-center justify-center text-white shadow-inner">
<svg class="w-4 h-4 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
</div>
</header>

        HOUSE ADMIN WORKSPACE

        Your listings

<p class="text-[14px] text-[#94A3B8] mt-1">

      </p>

<div class="flex justify-between items-center pt-1">
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-[#064E3B] text-[#4ADE80]">

          </span>
<button class="bg-[#2A1F4E] text-[#A78BFA] font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-[#3b2b6d] transition-colors">

<nav class="fixed bottom-4 left-4 right-4 h-16 rounded-[32px] bg-[#141B2D] border border-[#1E2A45] shadow-2xl flex items-center justify-around z-50 max-w-[358px] mx-auto px-2">
<!-- Dashboard (Inactive) -->
<a class="text-[#94A3B8] flex flex-col items-center justify-center gap-1 px-3 py-1.5 hover:text-white transition-colors" href="#">
<svg class="w-5 h-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"></path>
</svg>
<span class="text-[11px] font-medium leading-none">Dashboard</span>

<!-- Listings (Active) -->
