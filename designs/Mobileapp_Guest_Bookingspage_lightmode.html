<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayHaven - Bookings (Mobile)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f3f5;
    }
    /* Hide scrollbar for clean app experience */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen m-0 p-0 font-sans">
<!-- iPhone Mobile Viewport (390x844) -->
<div class="w-full min-h-screen bg-[#F8F9FA] relative flex flex-col font-sans overflow-x-hidden">
<!-- STICKY MOBILE HEADER -->
<header class="sticky top-0 z-50 bg-[#F8F9FA]/95 backdrop-blur-sm pt-6 px-4 pb-2 flex items-center justify-between border-b border-gray-100/50">
<!-- Left Logo -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-xl bg-[#7C3AED] flex items-center justify-center shadow-sm shadow-purple-200">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
</div>
<span class="text-[18px] font-bold text-black tracking-tight">StayHaven</span>
</div>
<!-- Right Header Actions -->
<div class="flex items-center gap-2">
<!-- Moon icon button -->
<button class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600 shadow-sm hover:bg-gray-50 transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
</svg>
</button>
<!-- Sign in pill -->
<button class="px-3 py-1 rounded-full bg-white border border-gray-200 text-xs font-semibold text-gray-700 shadow-sm hover:bg-gray-50 transition-colors">
          Sign in
        </button>
<!-- Profile icon -->
<button class="w-8 h-8 rounded-full bg-[#7C3AED] text-white flex items-center justify-center shadow-sm shadow-purple-200">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</button>
</div>
</header>
<!-- MAIN SCROLLABLE AREA -->
<main class="flex-1 w-full pb-[112px] overflow-y-auto no-scrollbar">
<!-- PAGE HEADER -->
<div class="px-4 mt-6">
<span class="text-[12px] uppercase tracking-wider font-bold text-[#7C3AED]">YOUR TRIPS</span>
<h1 class="text-[28px] font-bold text-[#111827] mt-1 leading-tight">Bookings</h1>
<p class="text-[14px] text-[#6B7280] mt-1">Everything you need for your upcoming and previous stays.</p>
<!-- Tab Toggle -->
<div class="mt-5 p-1 bg-gray-200/70 rounded-full flex items-center max-w-[200px]">
<button class="flex-1 py-1.5 px-3 rounded-full bg-white text-[#7C3AED] font-semibold text-xs text-center shadow-sm transition-all">
            Current
          </button>
<button class="flex-1 py-1.5 px-3 rounded-full text-[#6B7280] font-medium text-xs text-center hover:text-gray-900 transition-colors">
            Past
          </button>
</div>
</div>
<!-- BOOKING CARDS -->
<div class="mx-4 mt-6 flex flex-col gap-4 mb-8">
<!-- Card 1: Lavender House -->
<article class="bg-white rounded-[32px] p-0 shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
<!-- Top: Image of a bedroom -->
<div class="w-full h-[160px] relative overflow-hidden bg-gray-100">
<img alt="Lavender House bedroom" class="w-full h-[160px] object-cover block" src="https://lh3.googleusercontent.com/aida/AEtjO1XODr53P0b7avMG1Aemrx7hsAACQKaORY0Vu61vbaX9BmgJqPU3KxVcHJQ_3wl27zFlU9Ml_5kwwjdXt2v3bBtl17RCva71w21_vnx-SWBLuxPvWzP1wdojPUk0Y8J3LTyG5dFJzyuYlL7fKkjubiNRObuyrWi6ogLCj9YVBQmlnSPKfTNXAj2K27mCzp-Je0NTip-RCLdGmMnELXQ9ieniZUAUDlD9VgsDGr-CG-K3BTsATyKsHj3gJhM"/>
</div>
<!-- Content -->
<div class="p-5 flex flex-col gap-3">
<!-- Row 1 -->
<div class="flex justify-between items-start">
<div>
<h2 class="text-[18px] font-bold text-gray-900 leading-snug">Lavender House</h2>
<p class="text-[14px] text-gray-500 mt-0.5">Kampala, Uganda</p>
</div>
<span class="bg-emerald-50 text-emerald-700 border border-emerald-200/50 px-3 py-1 rounded-full text-xs font-semibold">
                Confirmed
              </span>
</div>
<!-- Divider -->
<div class="border-t border-gray-100 my-1"></div>
<!-- Row 2 -->
<div class="flex justify-between items-center">
<div class="flex items-center gap-2 text-gray-900">
<svg class="w-4 h-4 text-[#7C3AED]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
<span class="text-[14px] font-medium">Jun 18–21</span>
</div>
<button class="text-[#7C3AED] font-semibold text-sm bg-transparent hover:underline focus:outline-none">
                Details
              </button>
</div>
</div>
</article>
<!-- Card 2: The Cloud Villa -->
<article class="bg-white rounded-[32px] p-0 shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
<!-- Top: Image of a villa -->
<div class="w-full h-[160px] relative overflow-hidden bg-gray-100">
<img alt="The Cloud Villa" class="w-full h-[160px] object-cover block" src="https://lh3.googleusercontent.com/aida/AEtjO1VrN4A_6BXS3Ra10RhIBtdNvhD8SMM3k-YebaXxoJ5zqG3kuhysI_fYRNCP8TS6ilJMao-EAdb8l8XiC3DGxd4emRImpSjeS0pHNyELfOI1ORcx44h0DdnuRqdZvyoLGc5mejQmivUgfxnIF1IQywicUmUm28akCiCaGLpL0H8bmJX5m1PqjlMDgWNa0HoAucRik_Cb-fIuvrWzXiQdqsX28ncg21r5Xsm_Z0ccRL1JbDNmRARc4Bf0-kw"/>
</div>
<!-- Content -->
<div class="p-5 flex flex-col gap-3">
<!-- Row 1 -->
<div class="flex justify-between items-start">
<div>
<h2 class="text-[18px] font-bold text-gray-900 leading-snug">The Cloud Villa</h2>
<p class="text-[14px] text-gray-500 mt-0.5">Jinja, Uganda</p>
</div>
<span class="bg-emerald-50 text-emerald-700 border border-emerald-200/50 px-3 py-1 rounded-full text-xs font-semibold">
                Confirmed
              </span>
</div>
<!-- Divider -->
<div class="border-t border-gray-100 my-1"></div>
<!-- Row 2 -->
<div class="flex justify-between items-center">
<div class="flex items-center gap-2 text-gray-900">
<svg class="w-4 h-4 text-[#7C3AED]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
<span class="text-[14px] font-medium">Aug 04–09</span>
</div>
<button class="text-[#7C3AED] font-semibold text-sm bg-transparent hover:underline focus:outline-none">
                Details
              </button>
</div>
</div>
</article>
</div>
</main>
<!-- FLOATING MOBILE BOTTOM NAV (Active Bookings) -->
<nav class="fixed bottom-4 left-4 right-4 h-16 rounded-[32px] bg-white border border-gray-200 shadow-xl flex items-center justify-around z-50 max-w-[358px] mx-auto px-2">
<!-- Explore (INACTIVE) -->
<button class="text-gray-500 flex flex-col items-center gap-0.5 text-xs font-medium hover:text-gray-900 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
</svg>
<span>Explore</span>
</button>
<!-- Bookings (ACTIVE) -->
<button class="bg-[#EDE9FE] px-3 py-1.5 rounded-full flex items-center gap-1.5 text-[#7C3AED] font-medium text-xs">
<svg class="w-4 h-4 text-[#7C3AED]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
<span class="font-semibold">Bookings</span>
</button>
<!-- Reviews (INACTIVE) -->
<button class="text-gray-500 flex flex-col items-center gap-0.5 text-xs font-medium hover:text-gray-900 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
<span>Reviews</span>
</button>
</nav>
</div>
</body>
</html>
