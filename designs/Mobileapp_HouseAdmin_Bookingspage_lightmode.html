<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>StayHaven Bookings Mobile App (390x844)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Hide scrollbars for slick mobile app look */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen">
<!-- Mobile App Wrapper (390x844) -->
<div class="w-full h-full min-h-screen bg-[#F8F9FA] relative overflow-hidden flex flex-col font-sans">
<!-- Scroll Container -->
<div class="h-full overflow-y-auto" style="padding-bottom: 112px;">
<!-- Sticky Mobile Header -->
<header class="sticky top-0 z-50 bg-[#F8F9FA]/95 backdrop-blur-sm pt-6 px-4 pb-2 flex items-center justify-between border-b border-gray-100/50">

<div class="flex items-center gap-2">

</div>

<button class="bg-white border border-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-full font-medium shadow-sm hover:bg-gray-50 transition-colors">
            Sign out
          </button>

<div class="w-8 h-8 rounded-full bg-[#7C3AED] flex items-center justify-center text-white shadow-sm shadow-purple-500/20">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

</div>
<span class="px-3 py-1 rounded-full text-xs font-semibold bg-purple-50 text-[#7C3AED] border border-purple-200/50">

            </span>
</div>
<!-- Row 2: Dates & Manage CTA -->
<div class="pt-2 flex justify-between items-center border-t border-gray-50">
<span class="text-[14px] text-gray-500 font-medium">Oct 24–28</span>
<button class="bg-[#EDE9FE] hover:bg-[#DDD6FE] text-[#7C3AED] font-semibold px-4 py-1.5 rounded-full text-sm transition-colors">
              Manage
            </button>
</div>
</div>
<!-- Card 3: Elena & Julian -->

<div class="w-10 h-10 rounded-full bg-[#DBEAFE] text-[#2563EB] font-semibold flex items-center justify-center text-sm flex-shrink-0">

<div class="flex flex-col">

</div>

<svg class="w-4 h-4 text-[#7C3AED]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
